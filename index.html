<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>क्लास बंक — Study Soundtrack</title>
  <meta name="description" content="नोट्स नहीं बने, पर प्लेलिस्ट पूरी है.">
  <meta name="theme-color" content="#10162f">
  <meta property="og:title" content="क्लास बंक — Study Soundtrack">
  <meta property="og:description" content="नोट्स नहीं बने, पर प्लेलिस्ट पूरी है 🔁">
  <meta property="og:image" content="assets/images/hero.png">
 
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <div class="bg"></div>
    <div class="wash"></div>
    <div class="vignette"></div>
    <div class="grain"></div>

    <header class="topbar">
      <div id="clock">10:13 pm</div>
      <div class="listeners"><span class="dot"></span><span><b id="listeners">0</b> bunking rn</span></div>
      <button id="topPlay" class="round-btn" aria-label="Play/Pause">▶</button>
    </header>

    <section class="hero">
      <div class="badge">
        <span class="headphone">◉</span>
        <div>
          <strong>पढ़ाई का साउंडट्रैक</strong>
          <small>Study soundtrack loading…</small>
        </div>
      </div>
      <h1>क्लास बंक</h1>
      <p class="tagline">नोट्स नहीं बने, पर प्लेलिस्ट पूरी है <span>↻</span></p>
    </section>

    <section class="moods">
      <button class="mood active" data-mood="lofi">🌙 Lofi</button>
      <button class="mood" data-mood="bollywood">🎧 Bollywood Chill</button>
      <button class="mood" data-mood="phonk">⚡ Phonk Focus</button>
    </section>

    <section class="player">
      <img id="album" class="album" src="assets/images/hero.png" alt="Album art">
      <div class="details">
        <div id="title">Midnight Notes</div>
        <small id="artist">Lofi • Class Bunk</small>
      </div>

      <div class="controls">
        <button id="shuffle" class="icon-btn" title="Shuffle">⤨</button>
        <button id="prev" class="icon-btn" title="Previous">⏮</button>
        <button id="play" class="play-btn" title="Play/Pause">▶</button>
        <button id="next" class="icon-btn" title="Next">⏭</button>
        <button id="queue" class="icon-btn" title="Playlist">☷</button>
      </div>

      <div class="progress-wrap">
        <span id="current">0:00</span>
        <div id="progress" class="progress"><div id="fill"></div></div>
        <span id="duration">0:00</span>
      </div>
    </section>

    <section class="playlist">
      <h2>YOUR BACKBENCH PLAYLIST</h2>
      <div id="tracks"></div>
    </section>

    <footer>Made for every backbencher ❤️</footer>
  </main>
 <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <script src="script.js"></script>
</body>
</html>
